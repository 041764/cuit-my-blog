# ==================== 测试环境配置 ====================
spring.application.name=cuit-my-blog-test

# ==================== SQLite 内存数据库配置 ====================
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:file:memdb1?mode=memory&cache=shared
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus.mapper-locations=classpath:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.cuit.blog.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 关闭生产日志
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# ==================== 初始化数据库 ====================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema-h2.sql
spring.sql.init.data-locations=classpath:db/data-h2.sql

# ==================== 文件上传配置 ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
file.upload.path=./test-uploads
file.upload.allowed-types=jpg,jpeg,png,gif,webp

# ==================== 日志配置 ====================
logging.level.com.cuit.blog=info
logging.level.org.springframework.test=info
