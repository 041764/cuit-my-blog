spring.application.name=cuit-my-blog
server.port=8080

# ==================== 数据库配置 ====================
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:cuit_blog.db
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# ==================== 数据库初始化 ====================
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:db/schema.sql


# ==================== MyBatis-Plus 配置 ====================
# Mapper XML 文件位置
mybatis-plus.mapper-locations=classpath:/mapper/**/*.xml
# 实体类包扫描
mybatis-plus.type-aliases-package=com.cuit.blog.entity
# 开启驼峰命名转换
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 日志输出（开发环境）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== 文件上传配置 ====================
# 单个文件最大大小
spring.servlet.multipart.max-file-size=15MB
# 请求最大大小
spring.servlet.multipart.max-request-size=100MB
# 文件存储路径
file.upload.path=./uploads
# 允许的文件类型
file.upload.allowed-types=jpg,jpeg,png,gif,webp

# ==================== 用户配置 ====================
user.default-avatar=/uploads/default/avatar.png

# ==================== 日志配置 ====================
logging.level.com.cuit.blog=debug
logging.level.com.cuit.blog.mapper=debug

# ==================== JWT 配置 ====================
jwt.secret=cuitMyBlogSuperSecretKeyForJwtTokenGeneration2025!@
jwt.expiration=86400000
jwt.header=Authorization
jwt.token-prefix=Bearer


